# Copy this crate to crates/<name> to start a TUI, and rename the package and the binary to tui-<name>.
[package]
name = "tui-starter"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tui-starter"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
kit = { path = "../../kit" }
