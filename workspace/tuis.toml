# This node's TUIs, one table each. Read it before building a new one: reuse or extend a TUI that shows the same
# thing. Add yours here when you add its crate.
#
# [tui.<name>]
# title    = "What it shows, in a person's words"
# command  = "target/release/tui-<name>"   # from this folder, after `cargo build --release -p tui-<name>`
# shows    = ["where its data comes from: commands, files, APIs"]
# owner    = "@handle"                      # who keeps it working
# project  = "~/Documents/<repo>"           # what it's about, if it's one project
