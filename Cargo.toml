[package]
name = "tuis"
version = "0.2.1"
edition = "2021"
description = "TUIs for Pointman: agents build small terminal apps that show work that keeps happening, in a TUI folder this sets up on each node."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-tuis"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "05e824965dbab3d994599d8442973515afc10db2" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
