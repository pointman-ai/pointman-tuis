[package]
name = "tuis"
version = "0.5.0"
edition = "2021"
description = "TUIs for Pointman: agents build small terminal apps that show work that keeps happening, in a TUI folder this sets up on each node."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-tuis"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "b4b2f874595fac71d220bb920e96c6390678c5a2" }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml_edit = "0.25"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
