name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace/go.mod
          cache: false
      # the node's TUI folder as this release makes it: the kit's and the starter's tests pass, and the starter,
      # copied to cmd/ as an agent would, vets, builds and draws a frame (a fresh node: only the release's files)
      - name: The starter builds from workspace/, as on a node
        run: |
          dir=$(mktemp -d)
          cp -R workspace/. "$dir"/
          cd "$dir"
          go vet ./kit ./cmd/_starter
          go test ./kit ./cmd/_starter
          cp -R cmd/_starter cmd/demo
          go vet ./...
          go build -o bin/demo ./cmd/demo
          bin/demo --snapshot | head -5
