name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # the node's TUI folder as this release makes it: the starter, copied to crates/, builds and draws a frame
      - name: The starter builds from workspace/, as on a node
        run: |
          dir=$(mktemp -d)
          cp -R workspace/. "$dir"/
          mkdir -p "$dir/crates" "$dir/.cargo"
          mv "$dir/cargo-config.toml" "$dir/.cargo/config.toml"
          # a fresh node: only the release's files, no TUI of its own yet, must already be a workspace that builds
          (cd "$dir" && cargo build --release -p kit -p tui-starter)
          cp -R "$dir/crates/_starter" "$dir/crates/demo"
          sed -i.bak 's/tui-starter/tui-demo/g' "$dir/crates/demo/Cargo.toml"
          rm "$dir/crates/demo/Cargo.toml.bak"
          (cd "$dir" && cargo build --release -p tui-demo && cargo test -p kit -p tui-demo && target/release/tui-demo --snapshot | head -5)
